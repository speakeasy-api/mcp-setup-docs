# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: atlassian
title: Atlassian Rovo
summary: Connect Atlassian Rovo so users can access their permitted Jira, Confluence, and Compass work through the hosted MCP server.
speakeasy_add_server: auto
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: provider-steps
  requirements:
    - id: atlassian-cloud-site
      description: Atlassian Cloud site with Jira, Confluence, and/or Compass
    - id: product-access
      description: Atlassian account with access to the intended Cloud site and products
    - id: organization-policy-approval
      description: Administrative action when OAuth domains, IP allowlists, app-management policy, or strict network egress restricts the connection
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: rovo
    url: https://mcp.atlassian.com/v2/mcp
    transport: streamable-http
    authentication:
      - oauth-dcr
    provenance:
      - source: provider-documentation
        locator: https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/
        name: Get started with the Atlassian MCP server
        classification: official
        observed_at: "2026-09-30T00:00:00Z"
      - source: endpoint-observation
        locator: https://mcp.atlassian.com/v2/mcp
        classification: official
        observed_at: "2026-09-30T00:00:00Z"
      - source: endpoint-observation
        locator: https://mcp.atlassian.com/.well-known/oauth-protected-resource/v2/mcp
        classification: official
        observed_at: "2026-09-30T00:00:00Z"
