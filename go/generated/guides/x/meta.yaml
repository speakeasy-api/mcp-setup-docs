# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: x
title: X
summary: Connect the hosted X MCP server for read-only public-data access using an app-only Bearer Token.
aliases:
  - com.pulsemcp.mirror/xdevplatform-xmcp
speakeasy_add_server: catalog
credential_setup:
  options:
    - id: app-only-bearer
      kind: api_key
      upstream_setup: provider-steps
      fields:
        - id: bearer-token
          label: Bearer Token
          setup:
            - external.md#copy-bearer-token
  requirements:
    - id: x-developer-account
      description: X account enrolled in the Developer Platform with authority to create an app
    - id: x-api-credits
      description: API credits available in the X Developer Console for pay-per-usage requests
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://api.x.com/mcp
    transport: streamable-http
    authentication:
      - app-only-bearer
    provenance:
      - source: provider-documentation
        locator: https://docs.x.com/tools/mcp.md
        name: MCP servers for the X API and X developer docs
        classification: official
        observed_at: "2026-08-06T23:21:18Z"
