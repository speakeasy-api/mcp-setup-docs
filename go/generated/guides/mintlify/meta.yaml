    locator: https://www.mintlify.com/docs/ai/model-context-protocol
    name: Search Model Context Protocol (MCP) server
    classification: official
    observed_at: "2026-11-19T18:25:00Z"
  - source: provider-documentation
    locator: https://www.mintlify.com/docs/ai/admin-mcp-tools
    name: Admin MCP tools
    classification: official
    observed_at: "2026-11-19T18:25:00Z"
