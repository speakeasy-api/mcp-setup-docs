# yaml-language-server: $schema=../../schema/guide.v1.schema.json
# Drafted from provider documentation. Google Cloud remote MCP servers do not
# support Dynamic Client Registration, so the OAuth client is created manually
# in the Google Cloud console.
schema_version: 1
slug: google-compute-engine
title: Google Compute Engine
summary: Manage Compute Engine VM instances, disks, instance groups, snapshots, and images through Google's hosted Compute Engine MCP server.
aliases:
  - com.googleapis.compute/mcp
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
  requirements:
    - id: gcp-project
      description: Google Cloud project with billing enabled and the Compute Engine API enabled, an admin who can enable APIs, grant IAM roles, and configure the Google Auth platform (project Owner covers all three), and connecting users granted the MCP Tool User role plus Compute Engine roles for the operations they will perform
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://compute.googleapis.com/mcp
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: pulsemcp
        name: com.googleapis.compute/mcp
        version: 1.0.0
        classification: mirror
        observed_at: "2026-07-18T04:42:42Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/compute/docs/use-compute-engine-mcp
        name: Use the Compute Engine MCP server
        classification: official
        observed_at: "2026-07-23T15:15:19Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/compute/docs/reference/mcp
        name: Compute Engine MCP reference
        classification: official
        observed_at: "2026-07-23T15:15:19Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/mcp/supported-products
        name: Supported products
        classification: official
        observed_at: "2026-07-23T15:15:19Z"
      - source: endpoint-observation
        locator: https://compute.googleapis.com/.well-known/oauth-protected-resource/mcp
        name: Compute Engine MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-23T15:15:19Z"
