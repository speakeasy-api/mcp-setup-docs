# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-big-query
title: Google BigQuery
summary: Query and manage BigQuery data through Google's hosted BigQuery MCP server.
aliases:
  - com.pulsemcp.mirror/google-bigquery
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
  requirements:
    - id: google-cloud-project
      description: A Google Cloud project with the BigQuery API enabled; an administrator who can enable APIs, grant project IAM roles, configure the Google Auth platform, and create OAuth credentials; and connecting users granted MCP Tool User, BigQuery Job User, and BigQuery Data Viewer access
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://bigquery.googleapis.com/mcp
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://docs.cloud.google.com/bigquery/docs/use-bigquery-mcp
        name: Use the BigQuery MCP server
        classification: official
        observed_at: "2026-07-23T19:36:30Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/bigquery/docs/reference/mcp
        name: BigQuery MCP reference
        classification: official
        observed_at: "2026-07-23T19:36:30Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/mcp/supported-products
        name: Supported products
        classification: official
        observed_at: "2026-07-23T19:36:30Z"
      - source: endpoint-observation
        locator: https://bigquery.googleapis.com/mcp
        name: BigQuery MCP endpoint
        classification: official
        observed_at: "2026-07-23T19:36:30Z"
      - source: endpoint-observation
        locator: https://bigquery.googleapis.com/.well-known/oauth-protected-resource/mcp
        name: BigQuery MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-23T19:36:30Z"
