schema_version: 1
slug: sentry
title: Sentry
summary: Connect Sentry so users can search errors, triage issues, and inspect their permitted Sentry projects through Sentry's hosted MCP server.
aliases:
  - io.sentry/mcp
speakeasy_add_server: auto
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: none
  requirements:
    - id: sentry-account
      description: Sentry account on sentry.io with access to the organizations and projects users need
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://mcp.sentry.dev/mcp
    transport: streamable-http
    authentication:
      - oauth-dcr
    provenance:
