# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: gong
title: Gong
summary: Connect Gong's hosted MCP server so users can find calls, read transcripts, and retrieve insights within their Gong permissions.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: provider-steps
  requirements:
    - id: gong-tech-admin
      description: Gong tech admin to create the MCP server integration
    - id: gong-paid-seat
      description: Paid Gong seat for each connecting user; collaborator seats cannot connect
    - id: gong-credits
      description: Gong credits for tools that analyze calls and emails to generate insights
remotes:
  - id: hosted
    url: https://mcp.gong.io/mcp
    transport: streamable-http
    authentication:
      - oauth-dcr
    provenance:
      - source: provider-documentation
        locator: https://help.gong.io/docs/create-an-integration-to-connect-to-the-mcp-server
        name: Create an integration to connect to the MCP server
        classification: official
        observed_at: "2026-11-18T00:20:00Z"
      - source: endpoint-observation
        locator: https://mcp.gong.io/.well-known/oauth-protected-resource/mcp
        classification: official
        observed_at: "2026-11-18T00:20:00Z"
      - source: endpoint-observation
        locator: https://mcp.gong.io/.well-known/oauth-authorization-server
        classification: official
        observed_at: "2026-11-18T00:20:00Z"
documentation:
  external: external.md
  speakeasy: speakeasy.md
provenance:
  - source: provider-documentation
    locator: https://help.gong.io/docs/about-gong-mcp-server
    name: About Gong MCP server
    classification: official
    observed_at: "2026-11-18T00:20:00Z"
  - source: provider-documentation
    locator: https://help.gong.io/docs/manage-mcp-server-integrations
    name: Manage MCP server integrations
    classification: official
    observed_at: "2026-11-18T00:20:00Z"
  - source: provider-documentation
    locator: https://help.gong.io/docs/how-mcp-server-tools-and-apis-consume-credits
    name: How MCP server tools and APIs consume credits
    classification: official
    observed_at: "2026-11-18T00:20:00Z"
  - source: repository-doctrine
    locator: doctrine/speakeasy-setup.md
    name: Speakeasy setup canonical section
    classification: official
    observed_at: "2026-11-18T00:20:00Z"
