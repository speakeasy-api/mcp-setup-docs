# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-calendar
title: Google Calendar
summary: Connect Google Calendar through Google's hosted Calendar MCP server with a Google Cloud OAuth client.
speakeasy_add_server: auto
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
  requirements:
    - id: developer-preview
      description: Google has confirmed the intended Google Workspace account and registered the Google Cloud project in the Google Workspace Developer Preview Program; each connecting user belongs to the applicant's domain or company unless Google permits otherwise
    - id: google-cloud-project
      description: An administrator can enable Google Calendar API and Calendar MCP API in the registered project, configure Google Auth Platform, create OAuth credentials, and change project IAM; enabling services requires serviceusage.services.enable
    - id: connecting-user-access
      description: Each Developer Preview-eligible connecting user has mcp.tools.call on the project, normally through MCP Tool User though another predefined or custom role containing that permission suffices, access to the intended calendars, and applicable External-audience test-user status
    - id: workspace-app-approval
      description: If Calendar is Restricted or the new app requires approval, a Google Workspace administrator with the Service Settings privilege can approve the app under Workspace API controls
    - id: prompt-injection-screening
      description: An application or security owner has configured prompt and response screening for malicious content or prompt injection and documented the accepted risk when not using Google Model Armor
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://calendarmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/calendar/api/guides/configure-mcp-server
        name: Configure the Calendar MCP server
        classification: official
        observed_at: "2026-08-29T15:13:24Z"
      - source: provider-metadata
