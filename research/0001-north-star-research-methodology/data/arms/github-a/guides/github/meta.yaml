# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: github
title: GitHub
summary: Connect the hosted GitHub MCP Server with a fine-grained personal access token.
aliases:
  - io.github.github/github-mcp-server
speakeasy_add_server: catalog
credential_setup:
  requirements:
    - id: github-account
      description: A GitHub account with access to the repositories or organization resources the MCP Server should reach.
    - id: pat-policy
      description: Organization and enterprise policies that permit a fine-grained personal access token with the required resource owner, lifetime, and permissions.
  options:
    - id: personal-access-token
      kind: api_key
      upstream_setup: provider-steps
      fields:
        - id: authorization
          label: Authorization
          setup:
            - external.md#configure-and-generate-token
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: github
    url: https://api.githubcopilot.com/mcp/
    transport: streamable-http
    authentication:
      - personal-access-token
    provenance:
      - source: github
        classification: official
        locator: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
        observed_at: "2026-07-31T20:39:35Z"
