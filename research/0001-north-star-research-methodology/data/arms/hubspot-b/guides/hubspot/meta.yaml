# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: hubspot
title: HubSpot
summary: Connect a HubSpot account so users can work with their permitted CRM data through HubSpot's hosted MCP server.
aliases:
  - com.pulsemcp.mirror/hubspot
credential_setup:
  options:
    - id: oauth-mcp-auth-app
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-mcp-auth-app
        - id: client-secret
          label: Client secret
          setup:
            - external.md#create-mcp-auth-app
  requirements:
    - id: hubspot-account
      description: HubSpot account containing the CRM data to connect
    - id: developer-tools-access
      description: HubSpot Developer tools access permission, or assistance from a super admin who can grant it or perform app setup
    - id: intended-data-permissions
      description: HubSpot user permissions for the CRM data and operations the connecting user needs
speakeasy_add_server: catalog
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://mcp.hubspot.com
    transport: streamable-http
    authentication:
      - oauth-mcp-auth-app
    provenance:
      - source: provider-documentation
        locator: https://developers.hubspot.com/docs/apps/developer-platform/build-apps/integrate-with-hubspot-mcp-server
        name: Integrate AI tools with the HubSpot MCP server
