# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-sheets
title: Google Sheets
summary: Read and update spreadsheets through Google's hosted Google Sheets MCP server.
aliases:
  - google sheets
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
  requirements:
    - id: developer-preview-access
      description: Google Workspace Developer Preview Program approval for the Google Workspace account and Google Cloud project used for setup
    - id: google-cloud-admin
      description: Access to the registered Google Cloud project with permission to enable APIs, configure Google Auth Platform, and create OAuth clients
    - id: prompt-injection-screening
      description: An approved Model Armor configuration or another documented process that screens prompts and responses for malicious content or prompt injection
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://sheetsmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/sheets/api/guides/configure-mcp-server
        name: Configure the Sheets MCP server
        classification: official
        observed_at: "2026-07-31T20:48:39Z"
      - source: endpoint-observation
        locator: https://sheetsmcp.googleapis.com/mcp/v1
        name: Google Sheets MCP endpoint
        classification: official
        observed_at: "2026-07-31T20:48:39Z"
      - source: endpoint-observation
        locator: https://sheetsmcp.googleapis.com/.well-known/oauth-protected-resource/mcp/v1
        name: Google Sheets MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-31T20:48:39Z"
