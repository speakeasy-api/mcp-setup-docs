# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-sheets
title: Google Sheets
summary: Read and update spreadsheets through Google's hosted Sheets MCP server.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
  requirements:
    - id: developer-preview-access
      description: Every connecting Google Workspace account and the Google Cloud project are accepted into the Developer Preview Program
    - id: google-cloud-project
      description: An administrator who can enable the Google Sheets and Google Sheets MCP APIs, grant project IAM roles, configure Google Auth platform, and create OAuth credentials
    - id: connecting-user-access
      description: Each connecting user has MCP Tool User on the project, access to the intended spreadsheets, and permission under applicable Workspace app-access policy
    - id: prompt-injection-screening
      description: An application or security owner has configured prompt and response screening for malicious content or prompt injection
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://sheetsmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/sheets/api/guides/configure-mcp-server
        name: Set up the Sheets MCP server
        classification: official
        observed_at: "2026-07-31T20:48:45Z"
      - source: endpoint-observation
        locator: https://sheetsmcp.googleapis.com/mcp/v1
        name: Google Sheets MCP endpoint
        classification: official
        status: MCP initialize returned HTTP 200
        version: "2025-03-26"
        observed_at: "2026-07-31T20:48:45Z"
      - source: endpoint-observation
        locator: https://sheetsmcp.googleapis.com/.well-known/oauth-protected-resource/mcp/v1
        name: Google Sheets MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-31T20:48:45Z"
