# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-sheets
title: Google Sheets
summary: Connect the hosted Google Sheets MCP server so agents can work with spreadsheets using each user's Google permissions.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
  requirements:
    - id: developer-preview
      description: Access to the Google Workspace Developer Preview Program, because the Google Sheets MCP server is in Developer Preview
    - id: google-cloud-project
      description: A Google Cloud project in which the operator can enable the Google Sheets API and Google Sheets MCP API and configure Google Auth Platform
    - id: service-enable-permissions
      description: Permission to enable services in the project, including serviceusage.services.enable on the project and servicemanagement.services.bind on each service
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://sheetsmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/sheets/api/guides/configure-mcp-server
        name: Configure the Sheets MCP server
        classification: official
        observed_at: "2026-07-31T20:38:49Z"
      - source: endpoint-observation
        locator: https://sheetsmcp.googleapis.com/mcp/v1
        name: Google Sheets remote MCP server
        classification: official
        observed_at: "2026-07-31T20:38:49Z"
