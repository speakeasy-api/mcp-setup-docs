[tools]
claude = "latest"
go = "1.22"
node = "24"
pitchfork = "latest"

[tasks.pull-catalog]
description = "Pull our PulseMCP tenant catalog into tools/pulse-catalog/pulse-catalog.json"
run = "node tools/pulse-catalog/pull-pulse-catalog.mjs tools/pulse-catalog/pulse-catalog.json"

[tasks."_pipeline-install"]
description = "Install pipeline dependencies (hidden prerequisite)"
dir = "pipeline"
hide = true
run = "npm install"

[tasks.draft-guide]
description = "Draft a Guide via the Cursor SDK pipeline (pipeline/)"
dir = "pipeline"
depends = ["_pipeline-install"]
# Usage (from repo root): mise run draft-guide -- box [--overwrite] [--force] [--pause-on-scope] [...]
# Exit: 0 converged, 2 unconverged/blocked/failed, 3 awaiting_scope (--pause-on-scope)
# Requires CURSOR_API_KEY in the environment (user or team service-account key).
run = "npm run draft-guide --"

[tasks.lint-guide]
description = "Deterministic I4 grammar + meta schema lint for guide(s)"
dir = "pipeline"
depends = ["_pipeline-install"]
# Usage: mise run lint-guide -- box x
#        mise run lint-guide -- --json guides/box
run = "npm run lint-guide --"

[tasks."_mcp-oauth-probe-install"]
description = "Install tools/mcp-oauth-probe dependencies (hidden prerequisite)"
dir = "tools/mcp-oauth-probe"
hide = true
run = "npm install"

[tasks.probe-mcp-oauth]
description = "Discover MCP OAuth metadata; report CIMD / DCR support"
dir = "tools/mcp-oauth-probe"
depends = ["_mcp-oauth-probe-install"]
# Usage (from repo root): mise run probe-mcp-oauth -- <mcp-url> [--json]
run = "npm run probe --"

[tasks.generate-go]
description = "Sync publishable guide files into go/generated for the Go module"
dir = "go/internal/gen"
run = "go run ."

[tasks.check-go]
description = "Regenerate go/generated, fail on drift, then test the Go module"
run = "bash go/check.sh"
