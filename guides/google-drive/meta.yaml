# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-drive
title: Google Drive
summary: Connect the Google Drive remote MCP server with OAuth and each user's permitted Drive access.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
  requirements:
    - id: preview-project
      description: A registered Developer Preview Workspace account and Cloud project, with authority to accept the applicable terms
    - id: project-setup-access
      description: Service Usage Admin and OAuth Config Editor on the registered project
    - id: security-screening
      description: Existing prompt and response screening with documentation for user risk acceptance
    - id: user-access
      description: Eligible Google users with Drive and file access, plus conditional Workspace administrator approval
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://drivemcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/drive/api/guides/configure-mcp-server
        name: Configure the Google Drive MCP server
        classification: official
        observed_at: "2026-09-11T19:06:23Z"
provenance:
  - source: provider-documentation
    locator: https://developers.google.com/workspace/drive/api/guides/configure-mcp-server
    name: Configure the Google Drive MCP server
    classification: official
    observed_at: "2026-09-11T19:06:23Z"
  - source: provider-documentation
    locator: https://developers.google.com/workspace/preview
    name: Google Workspace Developer Preview Program
    classification: official
    observed_at: "2026-09-11T19:06:23Z"
  - source: provider-documentation
    locator: https://developers.google.com/workspace/guides/configure-mcp-security
    name: Configure MCP security
    classification: official
    observed_at: "2026-09-11T19:06:23Z"
