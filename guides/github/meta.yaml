# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: github
title: GitHub
summary: Connect GitHub so users can work with repositories and other resources their GitHub account is permitted to access through GitHub's hosted MCP server.
speakeasy_add_server: catalog
aliases:
  - io.github.github/github-mcp-server
credential_setup:
  options:
    - id: oauth-app
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#generate-oauth-credentials
        - id: client-secret
          label: Client secret
          setup:
            - external.md#generate-oauth-credentials
  requirements:
    - id: github-organization-admin
      description: Administrative access to the GitHub organization that will own the OAuth app
    - id: standard-github-cloud
      description: Standard GitHub.com hosting; GitHub Enterprise Cloud with data residency requires its tenant-specific remote URL
    - id: oauth-app-approval
      description: Access to an organization owner who can grant the registered OAuth app access when a target organization restricts OAuth apps
    - id: organization-sso
      description: A valid organization SSO session when accessing resources protected by SSO enforcement
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://api.githubcopilot.com/mcp/
    transport: streamable-http
    authentication:
      - oauth-app
    provenance:
      - source: provider-repository
        locator: https://github.com/github/github-mcp-server
        name: GitHub MCP Server
        classification: official
        observed_at: "2026-08-06T23:22:50Z"
      - source: provider-documentation
        locator: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
        name: Remote GitHub MCP Server
        classification: official
        observed_at: "2026-08-06T23:22:50Z"
      - source: provider-documentation
        locator: https://github.com/github/github-mcp-server/blob/main/docs/host-integration.md
        name: GitHub Remote MCP Integration Guide for MCP Host Authors
        classification: official
        observed_at: "2026-08-06T23:22:50Z"
      - source: endpoint-observation
        locator: https://api.githubcopilot.com/mcp/
        classification: official
        observed_at: "2026-08-06T23:22:50Z"
      - source: endpoint-observation
        locator: https://api.githubcopilot.com/.well-known/oauth-protected-resource/mcp/
        classification: official
        observed_at: "2026-08-06T23:22:50Z"
