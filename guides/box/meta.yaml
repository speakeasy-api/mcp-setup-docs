# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: box
title: Box
summary: Access, search, and manage Box content and Box AI through the hosted Box MCP server.
aliases:
  - com.pulsemcp.mirror/box
speakeasy_add_server: catalog
credential_setup:
  options:
    - id: oauth-integration
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-client-credentials
  requirements:
    - id: box-admin
      description: Box Admin or Co-Admin access to the enterprise's Admin Console (the roles that can add Integration Credentials)
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: primary
    url: https://mcp.box.com
    transport: streamable-http
    authentication:
      - oauth-integration
    provenance:
      - source: pulsemcp
        name: com.pulsemcp.mirror/box
        classification: mirror
        status: present
        scope: Speakeasy MCP Catalog
        observed_at: "2026-07-28T15:30:04Z"
      - source: provider-documentation
        locator: https://docs.box.com/en/box-mcp/about-box-mcp-server
        name: About Box MCP Server
        classification: official
        observed_at: "2026-07-28T15:30:04Z"
      - source: endpoint-observation
        locator: https://mcp.box.com/.well-known/oauth-protected-resource
        name: Box Model Context Protocol Server
        classification: official
        observed_at: "2026-07-28T15:30:04Z"
