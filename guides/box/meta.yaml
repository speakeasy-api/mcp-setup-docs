# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: box
title: Box
summary: Access, search, and manage Box content and Box AI through the hosted Box MCP server.
credential_setup:
  options:
    - id: oauth-integration
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - setup.md#add-integration-credentials
            - setup.md#copy-client-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - setup.md#add-integration-credentials
            - setup.md#copy-client-credentials
  requirements:
    - id: box-admin
      description: Box Admin or Co-Admin access to the enterprise's Admin Console (the roles that can add Integration Credentials)
documentation:
  setup: setup.md
remotes:
  - id: primary
    url: https://mcp.box.com
    transport: streamable-http
    authentication:
      - oauth-integration
    provenance:
