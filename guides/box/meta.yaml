# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: box
title: Box
summary: Connect the Speakeasy AI Control Plane to Box's hosted MCP server with credentials created by a Box Admin or Co-Admin.
aliases:
  - com.pulsemcp.mirror/box
speakeasy_add_server: catalog
credential_setup:
  options:
    - id: oauth-integration
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-client-credentials
  requirements:
    - id: box-admin
      description: Box Admin or Co-Admin access to the enterprise Admin Console to add Integration Credentials
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://mcp.box.com
    transport: streamable-http
    authentication:
      - oauth-integration
    provenance:
