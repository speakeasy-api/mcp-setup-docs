# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: salesforce
title: Salesforce
summary: Connect to Salesforce records through hosted SObject MCP servers with selectable read, write, and delete boundaries.
aliases:
  - com.pulsemcp.mirror/gram-salesforce
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-consumer-key
  requirements:
    - id: salesforce-admin
      description: Salesforce System Administrator access to an API-enabled org where Hosted MCP Servers are available, with authority to create an External Client App and enable servers
documentation:
  external: external.md
  speakeasy: speakeasy.md
speakeasy_add_server: custom-remote
remotes:
  - id: sobject-reads-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-reads
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-reads-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-reads
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-mutations-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-mutations
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-mutations-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-mutations
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-deletes-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-deletes
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-deletes-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-deletes
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-all-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-all
    transport: streamable-http
    authentication:
      - oauth-client
  - id: sobject-all-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-all
    transport: streamable-http
    authentication:
      - oauth-client
