# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: salesforce
title: Salesforce
summary: Connect to Salesforce hosted MCP servers using the Speakeasy application with a required support handoff or your own External Client App, selecting the appropriate endpoint and org type.
aliases:
  - com.pulsemcp.mirror/gram-salesforce
credential_setup:
  options:
    - id: speakeasy-application
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-consumer-key
  requirements:
    - id: salesforce-admin
      description: Salesforce System Administrator access to an API-enabled org where Hosted MCP Servers are available, with authority to install the Speakeasy application or create an External Client App, and enable the selected servers
documentation:
  external: external.md
  speakeasy: speakeasy.md
speakeasy_add_server: custom-remote
remotes:
  - id: sobject-reads-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-reads
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-reads-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-reads
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-mutations-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-mutations
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-mutations-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-mutations
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-deletes-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-deletes
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-deletes-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-deletes
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-all-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/sobject-all
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: sobject-all-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/sobject-all
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: data360-production
    url: https://api.salesforce.com/platform/mcp/v1/data/data360
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: data360-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/data/sandbox/data360
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: headless-360-production
    url: https://api.salesforce.com/platform/mcp/v1/platform/headless-360
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: headless-360-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/platform/headless-360
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: tableau-next-production
    url: https://api.salesforce.com/platform/mcp/v1/analytics/tableau-next
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
  - id: tableau-next-sandbox
    url: https://api.salesforce.com/platform/mcp/v1/sandbox/analytics/tableau-next
    transport: streamable-http
    authentication:
      - oauth-client
      - speakeasy-application
