# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-sheets
title: Google Sheets
summary: Connect Google Sheets data through Google's hosted Sheets MCP server.
speakeasy_add_server: auto
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
  requirements:
    - id: google-cloud-project
      description: Use a Google Cloud project registered for preview access. Service enablement requires Service Usage Admin or equivalent permission. OAuth setup requires OAuth Config Editor. Obtain Project IAM Admin help for role grants if needed. Project Creator is needed only to create a project.
    - id: preview-access
      description: Use an eligible individual Workspace account and the registered project. Accept applicable terms only with authority to bind the organization. Keep preview users within the organization. Government and regulatory entities other than educational institutions must use test or experimental data.
    - id: connecting-user-access
      description: Each connecting user needs spreadsheet access and must meet the OAuth audience and preview conditions. For External Testing, add eligible users to Test users. Authorization and refresh tokens expire seven days after consent.
    - id: workspace-app-approval
      description: If Workspace policy blocks access, an administrator with the Service Settings privilege must permit the application for the required scopes and organizational units.
    - id: prompt-injection-screening
      description: Configure Model Armor project floor settings with MCP sanitization and Google MCP Server selected. The setup person needs Model Armor Floor Setting Admin. The security owner must approve filters and logging. Payload logs can expose sensitive data.
    - id: speakeasy-access
      description: Use a Speakeasy AI Control Plane account with access to Sources and Authentication.
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://sheetsmcp.googleapis.com/mcp/v1
    transport: streamable-http
    tenanted: false
    authentication:
      - oauth-client
    provenance:
      - source: saved-research
        locator: research.md
        scope: Topic 5 establishes the fixed remote URL. The transcluded client setup source establishes streamable-http for the Speakeasy connection. This is not an endpoint probe.
        observed_at: "2026-09-11T19:07:42Z"
