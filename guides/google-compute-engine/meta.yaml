# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-compute-engine
speakeasy_add_server: custom-remote
title: Google Compute Engine
summary: Connect Google's remote Compute Engine MCP server with read-only resource access through the Speakeasy AI Control Plane.
aliases:
  - com.googleapis.compute/mcp
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#copy-client-credentials
  requirements:
    - id: billed-project
      description: Use an existing Google Cloud project with billing enabled.
    - id: service-setup-access
      description: The service setup person needs Compute Instance Admin (v1), Compute Security Admin, Service Account User, and Service Usage Admin. For API enablement alone, Service Usage Admin is sufficient.
    - id: project-access-manager
      description: A Project IAM Admin must grant missing project access. An authorized helper can do this work.
    - id: oauth-configuration-access
      description: An OAuth Config Editor configures the application and client. Policy acceptance requires separate organization authority.
    - id: connecting-user
      description: The read-only user needs MCP Tool User and Compute Viewer on the resource project. Internal users must belong to the parent organization; External test users must be listed for the application.
    - id: testing-limits
      description: External Testing supports up to 100 listed users. For these scopes, authorization and refresh tokens expire after seven days and require another sign-in.
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://compute.googleapis.com/mcp
    transport: streamable-http
    tenanted: false
    authentication:
      - oauth-client
provenance:
  - source: provider-documentation
    locator: https://docs.cloud.google.com/compute/docs/use-compute-engine-mcp
    name: Use the Compute Engine remote MCP server
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: provider-documentation
    locator: https://docs.cloud.google.com/compute/docs/reference/mcp
    name: Compute Engine MCP reference
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: provider-documentation
    locator: https://docs.cloud.google.com/mcp/set-up-authentication-mcp-servers
    name: Set up authentication for Google MCP servers
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: provider-documentation
    locator: https://developers.google.com/identity/protocols/oauth2/scopes?hl=en#compute
    name: Compute Engine API OAuth scopes
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: provider-documentation
    locator: https://developers.google.com/workspace/guides/configure-oauth-consent
    name: Configure OAuth consent
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: provider-documentation
    locator: https://support.google.com/cloud/answer/15549945
    name: Manage App Audience
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
  - source: client-implementation
    locator: https://github.com/speakeasy-api/gram/tree/496e62ca5d5ebd99f0c189f2614fc9c707e44659
    name: Gram upstream manual OAuth implementation
    classification: official
    observed_at: "2026-09-11T00:00:00Z"
