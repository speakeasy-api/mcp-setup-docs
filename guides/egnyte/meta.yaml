# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: egnyte
title: Egnyte
summary: Connect an Egnyte domain so users can search, read, and manage their permitted Egnyte files and folders through Egnyte's hosted MCP server.
aliases:
  - com.egnyte/mcp-server
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: provider-steps
  requirements:
    - id: egnyte-plan
      description: Egnyte domain on a plan that includes the MCP Server (Gen 4 Essential, Elite, or Ultimate, or an eligible Gen 3 Platform plan); available tools vary by plan and AI Add-On
    - id: egnyte-admin
      description: Egnyte administrator account for the domain, to change Settings > AI Powered Features > MCP Server
    - id: egnyte-user-access
      description: Egnyte user account for each person who connects, with permission to the files and folders they need
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://mcp-server.egnyte.com/mcp
    transport: streamable-http
    authentication:
      - oauth-dcr
    provenance:
      - source: provider-documentation
        locator: https://developers.egnyte.com/integration/cfs/api-docs/remote-mcp-server
        name: Remote MCP Server
        classification: official
        observed_at: "2026-11-11T00:13:00Z"
      - source: endpoint-observation
        locator: https://mcp-server.egnyte.com/mcp
        classification: official
        observed_at: "2026-11-11T00:13:00Z"
