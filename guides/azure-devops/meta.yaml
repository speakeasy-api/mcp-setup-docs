# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: azure-devops
title: Azure DevOps
summary: Connect the Speakeasy AI Control Plane to Microsoft's hosted Azure DevOps MCP server with a single-tenant Entra application for delegated user access.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: delegated-oauth
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: tenant-id
          label: Directory (tenant) ID
          setup:
            - external.md#register-entra-application
        - id: client-id
          label: Application (client) ID
          setup:
            - external.md#register-entra-application
        - id: client-secret
          label: Client secret Value
          setup:
            - external.md#create-client-secret
  requirements:
    - id: entra-backed-organization
      description: An Azure DevOps Services organization backed by a Microsoft Entra tenant; standalone Microsoft account organizations are not supported by the remote server.
    - id: entra-administration
      description: An Entra administrator who can provision the Azure DevOps MCP enterprise application if it is missing, register an application, and grant admin consent.
    - id: azure-devops-access
      description: Each person who connects needs membership in the projects and access to the resources their tools will use.
    - id: speakeasy-permission
      description: Permission to add a remote MCP server and configure its identity in the intended Speakeasy project.
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: organization
    url: "https://mcp.dev.azure.com/<organization>"
    transport: streamable-http
    authentication:
      - delegated-oauth
    tenanted: true
    provenance:
      - source: microsoft-public-docs
        locator: https://learn.microsoft.com/en-us/azure/devops/mcp-server/remote-mcp-server?view=azure-devops
        name: Set up the remote Azure DevOps MCP Server
        classification: official
        observed_at: "2026-11-11T03:30:00Z"
      - source: endpoint-probe
        locator: https://mcp.dev.azure.com/.well-known/oauth-protected-resource/fabrikam
        name: Unauthenticated initialize probe and protected-resource metadata for a placeholder organization
        observed_at: "2026-11-11T03:36:58Z"
