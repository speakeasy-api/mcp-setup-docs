schema_version: 1
slug: google-calendar
title: Google Calendar
summary: Connect the Google Calendar remote MCP server for private preview read and availability access.
speakeasy_add_server: custom-remote
credential_setup:
  requirements:
    - id: registered-project
      description: Use a Google Workspace account and an existing Google Cloud project registered for the Workspace Developer Preview Program.
    - id: project-permissions
      description: Obtain service enablement permission and OAuth Config Editor access on the registered project.
    - id: security-screening
      description: Supply organization-owned prompt and response screening and document the solution so users can accept the risk.
    - id: permitted-users
      description: Use permitted preview users with Calendar access and an eligible Internal account or assigned External test-user account.
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
remotes:
  - id: hosted
    url: https://calendarmcp.googleapis.com/mcp/v1
    # This is the client remote proxy transport. Google documents HTTP.
    transport: streamable-http
    tenanted: false
    authentication:
      - oauth-client
documentation:
  external: external.md
  speakeasy: speakeasy.md
# Observation dates are normalized to midnight; the dossier gives no time of day.
