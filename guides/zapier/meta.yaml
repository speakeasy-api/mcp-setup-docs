# yaml-language-server: $schema=../../schema/guide.v1.schema.json
# Drafted from provider documentation. In the default dynamic-discovery mode
# the server advertises static meta-tools; switched to manual configuration it
# instead advertises each pre-selected action as its own dedicated tool, which
# is per-tenant. See external.md#server-modes.
schema_version: 1
slug: zapier
title: Zapier
summary: Discover, enable, and run Zapier actions across thousands of connected apps through the hosted Zapier MCP server.
credential_setup:
  options:
    - id: connection-token
      kind: api_key
      fields:
        - id: token
          label: Connection token
          setup:
            - external.md#generate-connection-token
  requirements:
    - id: zapier-account
      description: Dedicated Zapier validation account with an MCP server created and its connection token
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: primary
    url: https://mcp.zapier.com/api/v1/connect
    transport: streamable-http
    authentication:
      - connection-token
