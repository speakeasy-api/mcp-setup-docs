# yaml-language-server: $schema=../../schema/guide.v1.schema.json
# Drafted from provider documentation. The inventory below is the dynamic
# discovery mode's static meta-tools — the default for a new server. A server
# switched to manual configuration instead advertises each pre-selected action
# as its own dedicated tool, which is per-tenant and cannot be documented here.
# Provider documentation does not describe readOnlyHint annotations, so no
# read_only_hint is authored; reconcile against the live inventory at remote
# validation.
schema_version: 1
slug: zapier
title: Zapier
summary: Discover, enable, and run Zapier actions across thousands of connected apps through the hosted Zapier MCP server.
credential_setup:
  options:
    - id: connection-token
      kind: api_key
      fields:
        - id: token
          label: Connection token
          setup:
            - setup.md#generate-connection-token
  requirements:
    - id: zapier-account
      description: Dedicated Zapier validation account with an MCP server created and its connection token
documentation:
  setup: setup.md
remotes:
  - id: primary
    url: https://mcp.zapier.com/api/v1/connect
    transport: streamable-http
    authentication:
      - connection-token
