# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-slides
title: Google Slides
summary: Connect Google Slides data through Google's hosted Slides MCP server.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
  requirements:
    - id: google-cloud-project
      description: A Google Cloud project where an administrator can enable the Google Slides API and Google Slides MCP API, grant project IAM roles, configure Google Auth platform, and create OAuth credentials
    - id: connecting-user-access
      description: Each connecting user has MCP Tool User on the project and access to the intended Google Slides presentations
    - id: workspace-api-access
      description: When organizational API controls restrict high-risk Drive and Slides scopes or unconfigured apps, a Google Workspace Service Settings administrator can allow the OAuth client
    - id: prompt-injection-screening
      description: An application or security owner has configured prompt and response screening for malicious content or prompt injection
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://slidesmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/slides/api/guides/configure-mcp-server
        name: Configure the Slides MCP server
        classification: official
        observed_at: "2026-07-29T21:55:52Z"
      - source: endpoint-observation
        locator: https://slidesmcp.googleapis.com/mcp/v1
        name: Google Slides MCP endpoint
        classification: official
        status: MCP initialize returned HTTP 200
        version: "2025-03-26"
        observed_at: "2026-07-29T21:55:52Z"
      - source: endpoint-observation
        locator: https://slidesmcp.googleapis.com/.well-known/oauth-protected-resource/mcp/v1
        name: Google Slides MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-29T21:55:52Z"
