schema_version: 1
slug: google-slides
title: Google Slides
summary: Connect Google Slides to the Speakeasy AI Control Plane with manual OAuth.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
  requirements:
    - id: google-cloud-project
      description: Use an existing Cloud project registered for Developer Preview. Use Service Usage Admin to enable services and OAuth Config Editor to configure OAuth.
    - id: preview-approval
      description: An authorized company representative must accept the preview terms. Keep use within the permitted audience and data limits.
    - id: connecting-user-access
      description: Use an eligible Workspace account with permission for the intended presentation operations. Add authorized users for External Testing.
    - id: workspace-api-access
      description: If Workspace policy limits access, a Workspace administrator with the Service Settings administrator privilege must approve the application.
    - id: prompt-injection-screening
      description: Use project-level Model Armor. The security owner must approve logging, routing, data residency, and effects on other integrated services. Use Model Armor Floor Setting Admin for floor-setting changes.
