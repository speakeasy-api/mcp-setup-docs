# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: intercom
title: Intercom
summary: Connect a US- or EU-hosted Intercom workspace through Intercom's hosted MCP server using a manually registered OAuth app.
credential_setup:
  options:
    - id: oauth-manual
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client Secret (optional)
          setup:
            - external.md#copy-client-credentials
  requirements:
    - id: supported-intercom-workspace
      description: An Intercom workspace hosted in the US or EU
    - id: developer-hub-app-access
      description: Access to Intercom's Developer Hub with permission to create and configure an OAuth app for the intended workspace
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: us
    url: https://mcp.intercom.com/mcp
    transport: streamable-http
    tenanted: true
    authentication:
      - oauth-manual
    provenance:
      - source: provider-documentation
        locator: https://developers.intercom.com/docs/guides/mcp
        name: Model Context Protocol (MCP)
        classification: official
