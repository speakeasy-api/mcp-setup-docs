# yaml-language-server: $schema=../../schema/guide.v1.schema.json
# Drafted from provider documentation. Google Cloud remote MCP servers do not
# support Dynamic Client Registration, so the OAuth client is created manually
# in the Google Cloud console. execute_sql_readonly appears in the provider's
# tool list but its live description is unverified; read_only_hint authoring
# is partly community-sourced — reconcile both against the live inventory at
# remote validation.
schema_version: 1
slug: bigquery
title: BigQuery
summary: Explore datasets and run SQL against Google BigQuery through Google's hosted BigQuery MCP server.
aliases:
  - google-bigquery
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - setup.md#create-oauth-client
        - id: client-secret
          label: OAuth client secret
          setup:
            - setup.md#create-oauth-client
  requirements:
    - id: bigquery-account
      description: Dedicated Google Cloud validation project with the BigQuery API enabled and a validation user granted the MCP Tool User, BigQuery Job User, and BigQuery Data Viewer roles
documentation:
  setup: setup.md
remotes:
  - id: primary
    url: https://bigquery.googleapis.com/mcp
    transport: streamable-http
    authentication:
      - oauth-client
    tools:
      - name: list_dataset_ids
        description: List BigQuery dataset IDs in a Google Cloud project.
        read_only_hint: true
      - name: get_dataset_info
        description: Get metadata about a BigQuery dataset.
        read_only_hint: true
      - name: list_table_ids
        description: List table IDs in a BigQuery dataset.
        read_only_hint: true
      - name: get_table_info
        description: Get metadata about a BigQuery table.
        read_only_hint: true
      - name: execute_sql_readonly
        description: Run a read-only SQL query and return the result.
        read_only_hint: true
      - name: execute_sql
        description: Run a SQL query synchronously and return the result; restricted to SELECT statements, though queries can invoke remote functions or Python UDFs.
provenance:
