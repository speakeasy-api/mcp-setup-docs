# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: slack
title: Slack
summary: Connect Slack with a prefilled app manifest and all MCP permissions selected by default, with optional access restrictions.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: internal-app-oauth
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-client-credentials
  requirements:
    - id: internal-slack-app
      description: Permission to create or manage an internal Slack app in the target workspace, and any required workspace-admin approval
    - id: user-access
      description: Each connecting user authorizes access to Slack with their own account
documentation:
  external: external.md
  speakeasy: speakeasy.md
  assets:
    - id: slack-create-from-manifest
      path: assets/slack-create-from-manifest.png
      media_type: image/png
      alt: "Slack's Create from a manifest dialog with the prefilled Speakeasy manifest and a workspace selected"
      width: 720
      height: 860
      content_hash: sha256:96572a9dea8ab6934b9c954020eb812b378362d57f11ba8be505990ac19dbeb3
    - id: slack-app-credentials
      path: assets/slack-app-credentials.png
      media_type: image/png
      alt: "Slack Basic Information page showing App Credentials with Client ID and Client Secret; values redacted"
      width: 776
      height: 590
      content_hash: sha256:02a4468e7883b6108bcb3a1e2d7657848618459a1eb73d259041272cb1dce99c
    - id: speakeasy-identity-settings
      path: assets/speakeasy-identity-settings.png
      media_type: image/png
      alt: "Identity settings with User Identity, the Slack provider, Manual client credentials, and all 30 scopes selected; values redacted"
      width: 506
      height: 766
      content_hash: sha256:f0cf55d9b7ca4e8d5cea61abf4cfb0b54504e957bd563a42b95e6d56a7dbad12
    - id: speakeasy-server-availability
      path: assets/speakeasy-server-availability.png
      media_type: image/png
      alt: "Server Availability toggle in the Danger Zone, set to Enabled"
      width: 510
      height: 124
      content_hash: sha256:6ab4dbd0ecff1997d7967ae2af0551a87286720cf986bd9e0a1cdc33b36ac419
remotes:
  - id: hosted
    url: https://mcp.slack.com/mcp
    transport: streamable-http
    authentication:
      - internal-app-oauth
    tenanted: false
    provenance:
      - source: provider-documentation
        locator: https://docs.slack.dev/ai/slack-mcp-server/
        classification: official
        observed_at: "2026-10-20T07:50:00Z"
provenance:
