# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-people
title: Google People
summary: Connect Google profile, contacts, and directory data through the People API remote MCP server.
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-oauth-credentials
  requirements:
    - id: registered-project
      description: Use an existing Google Cloud project registered in the Workspace Developer Preview Program.
    - id: setup-authority
      description: Use Service Usage Admin for APIs, OAuth Config Editor for OAuth setup, and Model Armor Floor Setting Admin for screening settings. Obtain authorized approval for terms.
    - id: connecting-user-access
      description: Keep users within the permitted domain or company. Users need underlying data access, conditional Workspace app approval, and test-user assignment for External Testing.
    - id: model-armor
      description: Configure Model Armor for Google MCP Server. Obtain approval for cross-jurisdictional processing and any full-payload logging.
documentation:
  external: external.md
  speakeasy: speakeasy.md
speakeasy_add_server: auto
remotes:
  - id: hosted
    url: https://people.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/people/v1/configure-mcp-server#configure-mcp-client
        name: Configure the People API MCP server — Others
        classification: official
        observed_at: "2026-09-11T00:00:00Z"
