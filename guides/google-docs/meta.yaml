# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-docs
title: Google Docs
summary: Read and change Google Docs through Google's remote Docs MCP server.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
  requirements:
    - id: registered-preview-account
      description: A Google Workspace account and Google Cloud project with final Developer Preview registration confirmation; use the registered account for this trial
    - id: service-enablement
      description: Service Usage Admin or equivalent permission to enable the Docs API, Docs MCP API, and Model Armor API in the registered project
    - id: oauth-configuration
      description: OAuth Config Editor (Beta) for consent configuration, test users, and manual Web application credentials
    - id: model-armor-policy
      description: Model Armor Floor Setting Admin for the project floor setting; security and billing approval for policy effects, usage cost, and applicable data-location requirements
    - id: terms-authority
      description: Authority to accept Preview terms and the Google API Services User Data Policy for the organization
    - id: project-creation
      description: Project Creator or equivalent permission only if a new project is needed
    - id: project-role-grants
      description: A project access administrator with Project IAM Admin or equivalent permission only if project roles must be granted
    - id: document-access
      description: The connecting account needs read or edit permission for the target documents; an owner or authorized editor can grant missing access
    - id: workspace-policy
      description: A Workspace administrator with Service Settings privilege only if policy blocks the client or required scopes
    - id: speakeasy-project-access
      description: Write access to the Speakeasy AI Control Plane project, separate from Google permissions
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://docsmcp.googleapis.com/mcp/v1
    # Schema classification for the documented HTTP remote; the provider does not
    # name Streamable HTTP. This value is not transport verification. See research.md.
    transport: streamable-http
    tenanted: false
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/docs/api/guides/configure-mcp-server
        name: Configure the Google Docs MCP server
        classification: official
        observed_at: "2026-09-11T19:52:38Z"
provenance:
