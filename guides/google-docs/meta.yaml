# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-docs
title: Google Docs
summary: Read and update Google Docs through Google's hosted Docs MCP server.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
  requirements:
    - id: google-cloud-project
      description: A Google Cloud project and an administrator who can enable the Google Docs API and Google Docs MCP API, configure the Google Auth platform, and create OAuth credentials
    - id: workspace-api-access
      description: When organizational API controls restrict high-risk Drive and Docs scopes or unconfigured apps, a Google Workspace Service Settings administrator who can allow the OAuth client
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://docsmcp.googleapis.com/mcp/v1
    transport: streamable-http
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://developers.google.com/workspace/docs/api/guides/configure-mcp-server
        name: Configure the Docs MCP server
        classification: official
        observed_at: "2026-07-29T20:37:14Z"
      - source: endpoint-observation
        locator: https://docsmcp.googleapis.com/mcp/v1
        name: Google Docs MCP endpoint
        classification: official
        observed_at: "2026-07-29T20:37:14Z"
      - source: endpoint-observation
        locator: https://docsmcp.googleapis.com/.well-known/oauth-protected-resource/mcp/v1
        name: Google Docs MCP protected-resource metadata
        classification: official
        observed_at: "2026-07-29T20:37:14Z"
