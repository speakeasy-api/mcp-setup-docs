# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: asana
title: Asana
summary: Connect an Asana workspace so users can access and manage their permitted Asana work through the hosted Asana MCP server.
aliases:
  - com.pulsemcp.mirror/asana-mcp
credential_setup:
  options:
    - id: oauth-mcp-app
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-mcp-app
        - id: client-secret
          label: Client secret
          setup:
            - external.md#create-mcp-app
  requirements:
    - id: asana-account
      description: Asana account with access to the developer console
    - id: workspace-membership
      description: Membership in each Asana workspace selected for a Specific workspaces distribution
    - id: organization-app-approval
      description: Organization super-admin approval when the Asana organization uses App management to block unapproved apps
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: primary
    url: https://mcp.asana.com/v2/mcp
    transport: streamable-http
    authentication:
      - oauth-mcp-app
    provenance:
      - source: provider-documentation
        locator: https://developers.asana.com/docs/integrating-with-asanas-mcp-server
        name: Integrating with Asana's MCP Server
        classification: official
        observed_at: "2026-07-27T18:17:01Z"
      - source: provider-documentation
        locator: https://developers.asana.com/docs/using-asanas-mcp-server
        name: Using Asana's MCP Server
        classification: official
        observed_at: "2026-07-27T18:17:01Z"
      - source: endpoint-observation
        locator: https://mcp.asana.com/v2/mcp
        classification: official
        observed_at: "2026-07-27T18:17:01Z"
