# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: datadog
title: Datadog
summary: Connect a Datadog organization so users can query their permitted monitors, logs, metrics, traces, and incidents through Datadog's hosted MCP server for its site.
aliases:
  - com.datadoghq/mcp
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: provider-steps
  requirements:
    - id: supported-datadog-site
      description: A Datadog organization on a commercial site (US1, US3, US5, EU1, AP1, AP2, or UK1); US1-FED and US2-FED are not supported
    - id: datadog-administrator
      description: A Datadog administrator who can open Organization Settings to turn on MCP Access and add the redirect URL
    - id: mcp-role-permissions
      description: Users whose Datadog roles include MCP Read (and MCP Write for write tools) plus the permissions for the data they query
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: us1
    url: https://mcp.datadoghq.com/v1/mcp
    transport: streamable-http
    tenanted: true
    authentication:
      - oauth-dcr
    provenance:
      - source: provider-documentation
        locator: https://docs.datadoghq.com/mcp_server/setup/#mcp-server-endpoints
        name: Set Up the Datadog MCP Server — MCP Server endpoints
        classification: official
        observed_at: "2026-11-10T02:22:05Z"
      - source: endpoint-observation
        locator: https://mcp.datadoghq.com/.well-known/oauth-protected-resource/v1/mcp
        classification: official
        status: unauthenticated initialize returned 401 with a resource_metadata challenge
        observed_at: "2026-11-10T02:22:05Z"
