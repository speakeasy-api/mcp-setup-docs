# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: microsoft-365
title: Microsoft 365
summary: Connect Outlook mail and calendar, Teams, SharePoint, OneDrive, and people search through Speakeasy's hosted Microsoft 365 MCP server with a customer-owned single-tenant Entra application.
aliases:
  - m365
  - outlook
  - microsoft-graph
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: delegated-oauth
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: tenant-id
          label: Directory (tenant) ID
          setup:
            - external.md#register-entra-application
        - id: client-id
          label: Application (client) ID
          setup:
            - external.md#register-entra-application
        - id: client-secret
          label: Client secret Value
          setup:
            - external.md#create-client-secret
  requirements:
    - id: microsoft-365-user
      description: Each connecting person has a Microsoft 365 work or school account with an Exchange Online mailbox, plus Teams and SharePoint or OneDrive access for those tools; personal Microsoft accounts are not supported.
    - id: entra-administration
      description: An Entra administrator authorized to register applications and grant tenant-wide admin consent; ChannelMessage.Read.All, Files.ReadWrite.All, and OnlineMeetingTranscript.Read.All always require admin consent.
    - id: speakeasy-permission
      description: Permission to add a remote MCP server and configure its identity and identity providers in the intended Speakeasy project.
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://catalog.speakeasy.com/m365/mcp
    transport: streamable-http
    authentication:
      - delegated-oauth
    tenanted: false
    provenance:
      - source: speakeasy-source
        locator: https://github.com/speakeasy-api/customer-mcps/pull/54
        name: Shared Microsoft 365 MCP server (customer-mcps src/shared/m365)
        status: Server and production route registration open for review; production endpoint not yet deployed
        scope: Remote URL derived from the production catalog domain and server slug in infra/prod; not an observation of a live production endpoint
        observed_at: "2026-11-06T05:40:00Z"
provenance:
  - source: speakeasy-source
    locator: https://github.com/speakeasy-api/customer-mcps/pull/54
    name: Shared Microsoft 365 MCP server README (authorization, scopes, Entra quirks)
    classification: official
    observed_at: "2026-11-06T05:40:00Z"
  - source: speakeasy-validation
    locator: local AI Control Plane deployment against a Speakeasy development tenant
    name: End-to-end sign-in and tool calls through a locally run control plane
    status: Passed for get_me, mail search, calendar search, availability, Teams, SharePoint folder search, people search, and draft create/delete
    scope: Local deployment with a tenant-specific custom identity provider and a manually registered single-tenant Entra client; production not tested
