# yaml-language-server: $schema=../../schema/guide.v1.schema.json
# Drafted from provider documentation. Tool inventory is drawn from the
# integration guide (the private mirror lists no remote tool inventory);
# reconcile against the live remote at scope acceptance before the draft
# PR leaves scaffold status.
schema_version: 1
slug: hubspot
title: HubSpot
summary: Search, read, and manage HubSpot CRM records, engagements, and marketing content through the hosted HubSpot MCP server.
credential_setup:
  options:
    - id: oauth-mcp-auth-app
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: MCP auth app client ID
          setup:
            - setup.md#create-mcp-auth-app
            - setup.md#copy-client-credentials
        - id: client-secret
          label: MCP auth app client secret
          setup:
            - setup.md#create-mcp-auth-app
            - setup.md#copy-client-credentials
  requirements:
    - id: hubspot-account
      description: Dedicated HubSpot validation account whose user can open the Development workspace and manage MCP auth apps
documentation:
  setup: setup.md
remotes:
  - id: primary
    url: https://mcp.hubspot.com
    transport: streamable-http
    authentication:
      - oauth-mcp-auth-app
    tools:
      - name: get_user_details
        description: Return details about the authenticated user, their account, and per-object read/write access.
        read_only_hint: true
      - name: search_crm_objects
        description: Search and filter CRM records with up to 5 filter groups of 6 filters each, 200 results per page.
        read_only_hint: true
      - name: get_crm_objects
        description: Fetch CRM objects by ID, up to 100 IDs per request.
        read_only_hint: true
      - name: manage_crm_objects
        description: Create or update CRM records and activities.
      - name: search_properties
        description: Find CRM property definitions by keyword, up to 5 keywords per request.
        read_only_hint: true
      - name: get_properties
        description: Return full property definitions including data types and enumerations.
        read_only_hint: true
      - name: search_owners
        description: Find CRM record owners by name, email, or ID, up to 100 results.
        read_only_hint: true
      - name: get_campaign_contacts_by_type
        description: Fetch paginated campaign contact IDs filtered by attribution type.
        read_only_hint: true
      - name: get_campaign_analytics
        description: Return campaign metrics and revenue attribution.
        read_only_hint: true
      - name: get_campaign_asset_types
        description: List available campaign asset type names.
        read_only_hint: true
      - name: get_campaign_asset_metrics
        description: Return metrics for CRM objects associated with campaigns.
        read_only_hint: true
      - name: submit_feedback
        description: Send feedback about the MCP server experience to HubSpot.
