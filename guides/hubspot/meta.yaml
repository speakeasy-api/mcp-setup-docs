# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: hubspot
title: HubSpot
summary: Search, read, and manage HubSpot CRM records and activities, and read marketing content, through the hosted HubSpot MCP server.
credential_setup:
  options:
    - id: oauth-mcp-auth-app
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#create-mcp-auth-app
            - external.md#copy-client-credentials
        - id: client-secret
          label: Client secret
          setup:
            - external.md#create-mcp-auth-app
            - external.md#copy-client-credentials
  requirements:
    - id: hubspot-account
      description: HubSpot account whose user can open the Development workspace from the main navigation bar to create and manage MCP auth apps
documentation:
  external: external.md
  speakeasy: speakeasy.md
