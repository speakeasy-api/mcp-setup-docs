# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: snowflake
title: Snowflake
summary: Connect the Speakeasy AI Control Plane to a Snowflake-managed MCP server that exposes an existing Cortex Agent.
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-oauth-credentials
  requirements:
    - id: snowflake-integration-admin
      description: Snowflake ACCOUNTADMIN access or a delegated role with global CREATE INTEGRATION for OAuth setup only; the runtime OAuth role must be non-privileged
    - id: existing-cortex-agent
      description: An existing Cortex Agent, its database, schema, and name, and the complete runtime privileges required by its configured tools
    - id: cortex-agent-mcp-access
      description: Approved MCP server object names, connecting users, default warehouse, non-privileged runtime role, and delegated privileges to create and grant access to the MCP server
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: cortex-agent-mcp
    url: "https://<account_url>/api/v2/databases/<mcp_database>/schemas/<mcp_schema>/mcp-servers/<mcp_server_name>"
    transport: streamable-http
    tenanted: true
    authentication:
      - oauth-client
