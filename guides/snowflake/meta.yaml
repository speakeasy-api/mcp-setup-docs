# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: snowflake
title: Snowflake
summary: Connect the Speakeasy AI Control Plane to a Snowflake-managed MCP server that exposes an approved Cortex Agent.
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-oauth-credentials
  requirements:
    - id: snowflake-integration-admin
      description: Snowflake ACCOUNTADMIN access or a delegated role with the global CREATE INTEGRATION privilege for setup; ACCOUNTADMIN and SECURITYADMIN cannot be the runtime OAuth role
    - id: approved-cortex-agent
      description: An approved Cortex Agent database, schema, and name; MCP server target database, schema, and name; non-privileged runtime role (existing or approved for creation); warehouse; and least-privilege grant set
documentation:
  external: external.md
  speakeasy: speakeasy.md
speakeasy_add_server: catalog
remotes:
  - id: cortex-agent-mcp
    url: "https://<account_url>/api/v2/databases/<database>/schemas/<schema>/mcp-servers/<name>"
    transport: streamable-http
    authentication:
      - oauth-client
