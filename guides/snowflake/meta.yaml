# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: snowflake
title: Snowflake
summary: Connect the Speakeasy AI Control Plane to a minimal Snowflake-managed MCP server with a read-only SQL query tool.
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      fields:
        - id: client-id
          label: Client ID
          setup:
            - external.md#copy-oauth-credentials
        - id: client-secret
          label: Client Secret
          setup:
            - external.md#copy-oauth-credentials
  requirements:
    - id: snowflake-integration-admin
      description: Snowflake ACCOUNTADMIN access or a delegated role with global CREATE INTEGRATION for OAuth setup only; the runtime OAuth role must be non-privileged
    - id: approved-sql-query-access
      description: Approved MCP object names, read-only SQL tool metadata, warehouse, connecting users, non-privileged runtime role, and least-privilege database, schema, table, or view grants
documentation:
  external: external.md
  speakeasy: speakeasy.md
speakeasy_add_server: catalog
remotes:
  - id: sql-query-mcp
    url: "https://<account_url>/api/v2/databases/<database>/schemas/<schema>/mcp-servers/<name>"
    transport: streamable-http
    authentication:
      - oauth-client
