# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: amplitude
title: Amplitude
summary: Connect a US- or EU-hosted Amplitude organization through Amplitude's hosted MCP server, with each user signing in with their own Amplitude account.
aliases:
  - com.amplitude/mcp
credential_setup:
  options:
    - id: oauth-dcr
      kind: oauth
      client_registration: dynamic
      upstream_setup: provider-steps
  requirements:
    - id: amplitude-project-access
      description: An Amplitude account with access to the projects the MCP server should read from or write to
    - id: mcp-allowed-for-organization
      description: The Amplitude MCP server allowed for the organization under Settings > Content Access > MCP, which only an organization admin can change
    - id: use-mcp-role-action
      description: A role that grants Use MCP (read) on the intended projects, plus Use MCP (write) where users should be able to change data
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: us
    url: https://mcp.amplitude.com/mcp
    transport: streamable-http
    tenanted: true
    authentication:
      - oauth-dcr
    provenance:
      - source: provider-documentation
        locator: https://amplitude.com/docs/amplitude-ai/amplitude-mcp
        name: Amplitude MCP Server
        classification: official
        observed_at: "2026-11-03T04:40:00Z"
      - source: endpoint-observation
        locator: https://mcp.amplitude.com/.well-known/oauth-protected-resource
        classification: official
        observed_at: "2026-11-03T04:40:00Z"
  - id: eu
