# yaml-language-server: $schema=../../schema/guide.v1.schema.json
schema_version: 1
slug: google-big-query
title: Google BigQuery
summary: Connect to Google's remote BigQuery MCP server with manual OAuth.
aliases:
  - com.pulsemcp.mirror/google-bigquery
speakeasy_add_server: custom-remote
credential_setup:
  options:
    - id: oauth-client
      kind: oauth
      client_registration: manual
      upstream_setup: provider-steps
      fields:
        - id: client-id
          label: OAuth client ID
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
            - speakeasy.md#connect-speakeasy-credentials
        - id: client-secret
          label: OAuth client secret
          setup:
            - external.md#create-oauth-client
            - external.md#copy-client-credentials
            - speakeasy.md#connect-speakeasy-credentials
  requirements:
    - id: google-cloud-project
      description: Use an existing Google Cloud project. Enable the BigQuery API if necessary. Billing is optional for the sandbox.
    - id: setup-authority
      description: Use Service Usage Admin for API enablement, Project IAM Admin for project grants, and OAuth Config Editor for OAuth setup, or equivalent permissions.
    - id: resource-grant-authority
      description: Use resource-specific grant permissions for data access. Existing dataset-level BigQuery Data Owner is one option for dataset grants.
    - id: organization-agreement-authority
      description: Obtain approval or help from a representative authorized to bind the organization before agreement acceptance. IAM roles do not give this authority.
    - id: connecting-user-access
      description: Give users MCP Tool User on the selected project, BigQuery Job User on the job project, and BigQuery Data Viewer on approved data resources, or equivalent access.
    - id: oauth-audience
      description: Internal requires an organization-associated project and users in that organization. Otherwise, use External Testing with listed test users. The limit is 100 test users. Authorization and refresh tokens expire after seven days.
documentation:
  external: external.md
  speakeasy: speakeasy.md
remotes:
  - id: hosted
    url: https://bigquery.googleapis.com/mcp
    transport: streamable-http
    tenanted: false
    authentication:
      - oauth-client
    provenance:
      - source: provider-documentation
        locator: https://docs.cloud.google.com/bigquery/docs/use-bigquery-mcp
        name: Use the BigQuery MCP server
        classification: official
        observed_at: "2026-09-11T00:00:00Z"
      - source: provider-documentation
        locator: https://docs.cloud.google.com/mcp/supported-products
        name: Supported products
        classification: official
        observed_at: "2026-09-11T00:00:00Z"
