name: Factory CI

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'tools/lint-guide/**'
      - 'FACTORY.md'
      - 'mise.toml'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'tools/lint-guide/**'
      - 'FACTORY.md'
      - 'mise.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lint-guide/go.mod

      - name: Test guide linter
        working-directory: tools/lint-guide
        run: go test ./...

      - name: Build guide linter
        working-directory: tools/lint-guide
        run: go build -o "$RUNNER_TEMP/lint-guide" ./cmd/lint-guide

      - name: Factory tests
        env:
          LINT_GUIDE_BIN: ${{ runner.temp }}/lint-guide
        run: bash factory/tests/run.sh

      - name: Shellcheck
        run: shellcheck factory/scripts/*.sh factory/tests/*.sh


      - name: Build factory image
        run: |
          docker build --build-arg KIT_VERSION=0.1.98 \
            --build-arg KIT_SHA256=7d14561469ced8af21df1075a9071d04a7bad1b1c5ff90d685142d3231abae85 \
            -f factory/Dockerfile .
