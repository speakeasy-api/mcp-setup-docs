name: Factory CI

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'go/internal/guidecheck/**'
      - 'go/cmd/lint-guide/**'
      - 'go/cmd/prepare-research-prompt/**'
      - 'go/internal/factoryprompt/**'
      - 'go/internal/factorytranscript/**'
      - 'go/internal/factoryrun/**'
      - 'go/cmd/export-transcript/**'
      - 'go/cmd/supervise-factory/**'
      - 'go/cmd/begin-writing/**'
      - 'go/cmd/finalize-factory/**'
      - 'go/internal/gen/**'
      - 'go/go.mod'
      - 'go/go.sum'
      - 'FACTORY.md'
      - 'mise.toml'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'go/internal/guidecheck/**'
      - 'go/cmd/lint-guide/**'
      - 'go/cmd/prepare-research-prompt/**'
      - 'go/internal/factoryprompt/**'
      - 'go/internal/factorytranscript/**'
      - 'go/internal/factoryrun/**'
      - 'go/cmd/export-transcript/**'
      - 'go/cmd/supervise-factory/**'
      - 'go/cmd/begin-writing/**'
      - 'go/cmd/finalize-factory/**'
      - 'go/internal/gen/**'
      - 'go/go.mod'
      - 'go/go.sum'
      - 'FACTORY.md'
      - 'mise.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Build and smoke-test factory image
        timeout-minutes: 10
        run: FACTORY_TEST_IMAGE=1 bash factory/tests/test-container.sh

      - name: Execute release-locked native dispatch fixture
        timeout-minutes: 8
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          (cd go && go build -o "$RUNNER_TEMP/prepare-research-prompt" ./cmd/prepare-research-prompt)
          FACTORY_PROMPT_ASSEMBLER="$RUNNER_TEMP/prepare-research-prompt" bash factory/tests/test-native-dispatch.sh --execute

      - name: Factory tests
        run: bash factory/tests/run.sh

      - name: Shellcheck
        run: shellcheck factory/scripts/*.sh factory/tests/*.sh factory/tests/fixtures/lifecycle/kit

      - name: Guidecheck tests
        working-directory: go
        run: go test ./internal/guidecheck ./cmd/lint-guide

      - name: Factory Go tests
        working-directory: go
        run: go test ./internal/factoryprompt ./cmd/prepare-research-prompt ./internal/factorytranscript ./cmd/export-transcript ./internal/factoryrun ./cmd/supervise-factory ./cmd/begin-writing ./cmd/finalize-factory
