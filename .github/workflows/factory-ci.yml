name: Factory CI

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'go/internal/guidecheck/**'
      - 'go/cmd/lint-guide/**'
      - 'FACTORY.md'
      - 'mise.toml'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'factory/**'
      - '.github/workflows/guide-draft.yml'
      - '.github/workflows/factory-ci.yml'
      - 'go/internal/guidecheck/**'
      - 'go/cmd/lint-guide/**'
      - 'FACTORY.md'
      - 'mise.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Factory tests
        run: bash factory/tests/run.sh

      - name: Shellcheck
        run: shellcheck factory/scripts/*.sh factory/tests/*.sh

      - name: Guidecheck tests
        working-directory: go
        run: go test ./internal/guidecheck ./cmd/lint-guide

      - name: Build factory image
        run: |
          docker build --build-arg KIT_VERSION=0.1.130 \
            --build-arg KIT_SHA256=232bbbf2958e9b83aba352ecfc7195768868f630cbf5fcdcdeb45b2ed12f5ecd \
            -f factory/Dockerfile .
